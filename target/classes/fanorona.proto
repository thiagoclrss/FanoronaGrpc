// Versão do compilador
syntax = "proto3";

// Configurações para a geração do código Java
option java_multiple_files = true;
option java_package = "network.grpc";
option java_outer_classname = "FanoronaProto";

// 1. A definição do Serviço (O "Controlador" da Rede)
service FanoronaService {
  // Streaming Bidirecional: Tanto o cliente quanto o servidor recebem e enviam um fluxo contínuo
  rpc Jogar (stream PacoteRede) returns (stream PacoteRede);
}

// 2. O empacotador principal
message PacoteRede {
  // O comando 'oneof' atua como um cofre de segurança.
  // Ele garante que um pacote SÓ PODE CONTER UMA das opções abaixo por vez.
  oneof tipo_pacote {
    Movimento movimento = 1;
    MensagemChat chat = 2;
    AcaoSimples acao = 3;
  }
}

// 3. Os tipos rigorosos de dados
message Movimento {
  int32 linha_origem = 1;
  int32 coluna_origem = 2;
  int32 linha_destino = 3;
  int32 coluna_destino = 4;
}

message MensagemChat {
  string texto = 1;
}

// Enumeração para facilitar comandos sem payload de dados
enum TipoAcao {
  PASSAR_TURNO = 0;
  DESISTIR = 1;
}

message AcaoSimples {
  TipoAcao tipo = 1;
}